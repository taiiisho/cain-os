# Builds the Cain OS app (APK) in the cloud every time you change the project on GitHub,
# and publishes it at a fixed download link:
#   https://github.com/<you>/<repo>/releases/latest/download/CainOS.apk
name: Build Cain OS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run the logic tests
        run: |
          mkdir -p /tmp/t
          javac --release 11 -d /tmp/t \
            app/src/main/java/com/kairnlabs/cainos/JsonIn.java \
            app/src/main/java/com/kairnlabs/cainos/IptvSync.java \
            app/src/main/java/com/kairnlabs/cainos/LinkServer.java \
            tests/java/PureTests.java
          java -cp /tmp/t PureTests

      - name: Unpack the signing key
        env:
          KEY_B64: ${{ secrets.CAIN_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEY_B64" ]; then
            echo "::error::The CAIN_KEYSTORE_B64 secret is missing. Add it under Settings > Secrets and variables > Actions (see the install guide)."
            exit 1
          fi
          echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/cainos.jks"
          echo "CAIN_KEYSTORE_FILE=$RUNNER_TEMP/cainos.jks" >> "$GITHUB_ENV"

      - name: Build the app
        env:
          CAIN_KEYSTORE_PASSWORD: ${{ secrets.CAIN_KEYSTORE_PASSWORD || 'cainos-kairnlabs' }}
        run: |
          gradle --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/CainOS-*-release.apk CainOS.apk
          ls -la CainOS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CainOS
          path: CainOS.apk

      - name: Publish the download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Cain OS (latest build)
          body: "Install on Google TV or Fire TV with the Downloader app: https://github.com/${{ github.repository }}/releases/latest/download/CainOS.apk"
          files: CainOS.apk
          make_latest: true
