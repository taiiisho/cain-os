<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060504">
<title>Cain OS · Phone Link</title>
<style>
:root{--ink:#060504;--ink2:#15120f;--paper:#EFEBE3;--soft:#8f887d;--hot:#FF5A1F;--line:rgba(239,235,227,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--paper);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:max(18px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;margin:4px 0 22px}
header svg{width:30px;height:30px;flex:none}
header b{font-size:19px;letter-spacing:-.01em}
header small{display:block;color:var(--soft);font-size:13px}
#dot{margin-left:auto;width:10px;height:10px;border-radius:50%;background:#46c46e;flex:none}
#dot.off{background:#d33}
h2{font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin:28px 0 10px}
.card{background:var(--ink2);border-radius:20px;padding:18px;box-shadow:inset 0 0 0 1px var(--line)}
input,select{width:100%;height:52px;border-radius:14px;border:0;padding:0 16px;font:inherit;font-size:17px;color:var(--paper);background:rgba(239,235,227,.08);outline:0}
input:focus,select:focus{box-shadow:inset 0 0 0 2px var(--paper)}
label{display:block;font-size:13px;color:var(--soft);margin:12px 0 6px}
button{height:52px;border:0;border-radius:26px;padding:0 22px;font:inherit;font-size:16px;font-weight:600;color:var(--paper);background:rgba(239,235,227,.1);cursor:pointer}
button.primary{background:var(--paper);color:var(--ink)}
button:active{transform:scale(.97)}
button:disabled{opacity:.45}
.row{display:flex;gap:10px;margin-top:14px}
.row>*{flex:1}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:330px;margin:0 auto}
.pad button{height:72px;border-radius:22px;font-size:22px}
.pad .ok{background:var(--paper);color:var(--ink);font-size:17px}
.pad .sm{font-size:15px}
.media{display:flex;gap:10px;justify-content:center;margin-top:14px}
.media button{width:64px;padding:0;font-size:20px}
#now{display:flex;align-items:center;gap:12px;color:var(--soft);font-size:14px;margin-bottom:14px}
#now b{color:var(--paper);display:block;font-size:16px}
.code{font:500 34px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.3em;text-align:center}
.msg{margin-top:12px;font-size:14px;color:var(--soft);min-height:20px}
.msg.err{color:#ff7a6b}
.msg.ok{color:#7fd796}
.bar{height:6px;border-radius:3px;background:rgba(239,235,227,.14);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:var(--hot);transition:width .2s}
.seg{display:flex;background:rgba(239,235,227,.06);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;height:44px;border-radius:12px;background:transparent;color:var(--soft);font-size:14px;padding:0 6px;white-space:nowrap}
.seg button.on{background:var(--paper);color:var(--ink)}
p.note{color:var(--soft);font-size:14px;margin:10px 0 0}
[hidden]{display:none!important}
</style>
</head><body>
<header>
  <svg viewBox="0 0 64 64" aria-hidden="true"><path fill-rule="evenodd" d="M32 6 54 22.6 45.6 54H18.4L10 22.6Z M31.5 7.2h1.4L29.1 54h-2.4Z" fill="#EFEBE3"/></svg>
  <div><b id="tvName">Cain OS</b><small>Phone Link</small></div>
  <span id="dot" class="off"></span>
</header>

<!-- pairing -->
<section id="pair" hidden>
  <div class="card">
    <b style="font-size:20px">Enter the code on your TV</b>
    <p class="note">It’s on the Phone Link screen (Settings → Phone Link). You only need to do this once on this phone.</p>
    <input id="code" class="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="••••••" style="margin-top:16px;height:64px">
    <div class="row"><button class="primary" id="pairBtn">Connect</button></div>
    <div class="msg" id="pairMsg"></div>
  </div>
</section>

<main id="app" hidden>
  <h2>Type</h2>
  <div class="card">
    <div id="askLbl" class="note" style="margin:0 0 8px" hidden></div>
    <input id="text" placeholder="Search, or answer the TV" enterkeyhint="send" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="row"><button class="primary" id="sendText">Send to TV</button></div>
  </div>

  <h2>Remote</h2>
  <div class="card">
    <div id="now" hidden><div><b id="nowT"></b><span id="nowA"></span></div></div>
    <div class="pad">
      <button class="sm" data-k="back">Back</button><button data-k="up">▲</button><button class="sm" data-k="home">Home</button>
      <button data-k="left">◀</button><button class="ok" data-k="ok">OK</button><button data-k="right">▶</button>
      <button class="sm" data-k="hold">Options</button><button data-k="down">▼</button><button class="sm" data-k="search">Search</button>
    </div>
    <div class="media">
      <button data-m="prev" aria-label="Previous">⏮</button><button data-m="toggle" aria-label="Play or pause">⏯</button><button data-m="next" aria-label="Next">⏭</button>
    </div>
  </div>

  <h2>Send to the TV</h2>
  <div class="card">
    <div class="seg" id="kindSeg">
      <button data-kind="music" class="on">Music</button><button data-kind="wallpaper">Background</button><button data-kind="photo">Profile photo</button>
    </div>
    <label for="prof" id="profLbl" hidden>For profile</label>
    <select id="prof" hidden></select>
    <p class="note" id="kindNote"></p>
    <input type="file" id="file" hidden>
    <div class="row"><button class="primary" id="pick">Choose files</button></div>
    <div class="bar" hidden id="upBar"><i></i></div>
    <div class="msg" id="upMsg"></div>
  </div>

  <h2>IPTV provider</h2>
  <div class="card">
    <div id="iptvNow" class="note" style="margin:0 0 12px"></div>
    <div class="seg" id="ipSeg"><button data-t="xtream" class="on">Server login</button><button data-t="m3u">M3U link</button></div>
    <div id="ipX">
      <label for="ipHost">Server address</label><input id="ipHost" placeholder="example.com:8080" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="url">
      <label for="ipUser">Username</label><input id="ipUser" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off">
      <label for="ipPass">Password</label><input id="ipPass" type="password" autocomplete="off">
    </div>
    <div id="ipM" hidden><label for="ipUrl">Playlist link</label><input id="ipUrl" placeholder="http://…" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="url"></div>
    <p class="note">The same details you use in IPTV Smarters Pro. They go straight to your TV, which keeps them.</p>
    <div class="row"><button class="primary" id="ipSend">Connect on TV</button></div>
    <div class="msg" id="ipMsg"></div>
  </div>
  <p class="note" style="text-align:center;margin-top:26px"><button id="unpair" style="background:none;color:var(--soft);font-weight:500;height:auto;padding:6px">Disconnect this phone</button></p>
</main>

<script>
(function(){
  'use strict';
  var $=function(s){return document.querySelector(s)};
  var TOKEN=null; try{ TOKEN=localStorage.getItem('cainToken'); }catch(e){}
  var STATE={}, kind='music', ipType='xtream';

  function api(path,body,raw){
    var h={'Content-Type':raw?'application/octet-stream':'application/json'}; if(TOKEN) h['X-Cain-Token']=TOKEN;
    return fetch(path,{method:body===undefined?'GET':'POST',headers:h,body:body===undefined?undefined:(raw?body:JSON.stringify(body))})
      .then(function(r){ return r.json().catch(function(){return {};}).then(function(j){ if(r.status===401){ unpaired(); } j.status=r.status; return j; }); });
  }
  function unpaired(){ TOKEN=null; try{ localStorage.removeItem('cainToken'); }catch(e){} $('#app').hidden=true; $('#pair').hidden=false; }
  function msg(id,t,cls){ var m=$(id); m.textContent=t||''; m.className='msg'+(cls?' '+cls:''); }

  /* pairing */
  $('#pairBtn').onclick=function(){
    var c=$('#code').value.replace(/\D/g,''); if(c.length!==6){ msg('#pairMsg','The code has 6 digits.','err'); return; }
    $('#pairBtn').disabled=true; msg('#pairMsg','Connecting…');
    api('/api/pair',{code:c}).then(function(j){ $('#pairBtn').disabled=false;
      if(j.ok&&j.token){ TOKEN=j.token; try{ localStorage.setItem('cainToken',TOKEN); }catch(e){} $('#pair').hidden=true; $('#app').hidden=false; poll(); }
      else msg('#pairMsg',j.error||'That code didn’t work.','err'); })
    .catch(function(){ $('#pairBtn').disabled=false; msg('#pairMsg','Couldn’t reach the TV. Is this phone on the same Wi-Fi?','err'); });
  };
  $('#code').addEventListener('keydown',function(e){ if(e.key==='Enter') $('#pairBtn').click(); });

  /* typing */
  function sendText(){ var t=$('#text').value; if(!t.trim()) return; api('/api/text',{text:t}).then(function(){ $('#text').value=''; }); }
  $('#sendText').onclick=sendText;
  $('#text').addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); sendText(); } });

  /* remote */
  document.querySelectorAll('[data-k]').forEach(function(b){ b.onclick=function(){ api('/api/key',{key:b.dataset.k}); if(navigator.vibrate) navigator.vibrate(8); }; });
  document.querySelectorAll('[data-m]').forEach(function(b){ b.onclick=function(){ api('/api/media',{cmd:b.dataset.m}); }; });

  /* uploads */
  var KN={music:['Choose songs','audio/*,.mp3,.m4a,.aac,.wav,.ogg,.oga,.flac,.opus',true,'MP3, M4A, FLAC, WAV, OGG or Opus. They’re added to the music on Home, with their cover art if the file has it.'],
          wallpaper:['Choose a photo or video','image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,.jpg,.jpeg,.png,.webp,.gif,.mp4,.webm',false,'A photo, GIF or short MP4 video. It replaces this profile’s background; videos loop silently.'],
          photo:['Choose a photo','image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp',false,'A JPG, PNG or WebP picture for the profile circle.']};
  function setKind(k){ kind=k; document.querySelectorAll('#kindSeg button').forEach(function(b){ b.classList.toggle('on',b.dataset.kind===k); });
    var d=KN[k]; $('#pick').textContent=d[0]; $('#file').accept=d[1]; $('#file').multiple=d[2]; $('#kindNote').textContent=d[3];
    $('#prof').hidden=$('#profLbl').hidden=k==='music'; msg('#upMsg',''); }
  document.querySelectorAll('#kindSeg button').forEach(function(b){ b.onclick=function(){ setKind(b.dataset.kind); }; });
  $('#pick').onclick=function(){ $('#file').value=''; $('#file').click(); };
  $('#file').onchange=function(){ var fs=[].slice.call($('#file').files||[]); if(fs.length) uploadAll(fs); };
  function uploadAll(fs){
    var i=0, ok=0, bar=$('#upBar'), fill=bar.firstChild; bar.hidden=false; $('#pick').disabled=true;
    (function next(){
      if(i>=fs.length){ $('#pick').disabled=false; bar.hidden=true; msg('#upMsg',ok===fs.length?(ok>1?ok+' files sent.':'Sent.'):(ok+' of '+fs.length+' sent. The rest weren’t a type the TV can use.'),ok===fs.length?'ok':'err'); return; }
      var f=fs[i++], q='kind='+encodeURIComponent(kind)+'&name='+encodeURIComponent(f.name)+(kind!=='music'&&$('#prof').value?'&profile='+encodeURIComponent($('#prof').value):'');
      msg('#upMsg','Sending '+f.name+(fs.length>1?' ('+i+' of '+fs.length+')':'')+'…');
      var x=new XMLHttpRequest(); x.open('POST','/api/upload?'+q); x.setRequestHeader('X-Cain-Token',TOKEN||''); x.setRequestHeader('Content-Type','application/octet-stream');
      x.upload.onprogress=function(e){ if(e.lengthComputable) fill.style.width=((i-1+e.loaded/e.total)/fs.length*100)+'%'; };
      x.onload=function(){ if(x.status===401){ unpaired(); return; } if(x.status===200) ok++; next(); };
      x.onerror=function(){ $('#pick').disabled=false; bar.hidden=true; msg('#upMsg','The upload was cut off. Check the Wi-Fi and try again.','err'); };
      x.send(f);
    })();
  }

  /* IPTV */
  document.querySelectorAll('#ipSeg button').forEach(function(b){ b.onclick=function(){ ipType=b.dataset.t; document.querySelectorAll('#ipSeg button').forEach(function(x){ x.classList.toggle('on',x===b); }); $('#ipX').hidden=ipType!=='xtream'; $('#ipM').hidden=ipType==='xtream'; }; });
  $('#ipSend').onclick=function(){
    var c=ipType==='m3u'?{type:'m3u',url:$('#ipUrl').value.trim()}:{type:'xtream',host:$('#ipHost').value.trim(),user:$('#ipUser').value.trim(),pass:$('#ipPass').value};
    if(c.type==='m3u'?!/^https?:\/\/.+/i.test(c.url):!(c.host&&c.user&&c.pass)){ msg('#ipMsg',c.type==='m3u'?'Enter the full link, starting with http.':'Fill in all three.','err'); return; }
    api('/api/iptv',c).then(function(j){ if(j.ok){ msg('#ipMsg','Sent. Watch the TV: it’s connecting now.','ok'); $('#ipPass').value=''; } else msg('#ipMsg','The TV didn’t accept that.','err'); });
  };
  $('#unpair').onclick=function(){ unpaired(); };

  /* state from the TV */
  var pollT=0;
  function poll(){ clearTimeout(pollT); if(!TOKEN) return;
    api('/api/state').then(function(s){ if(s.status!==200) return; STATE=s; $('#dot').className='';
      $('#tvName').textContent=s.name||'Cain OS';
      var al=$('#askLbl'); al.hidden=!s.asking; al.textContent=s.asking?'The TV is asking: '+s.asking:''; $('#text').placeholder=s.asking?'Type it here':'Search, or answer the TV';
      var n=s.now; $('#now').hidden=!n; if(n){ $('#nowT').textContent=n.t; $('#nowA').textContent=(n.a||'')+(n.playing?'':' · paused'); }
      $('#iptvNow').textContent=s.iptv?('Connected: '+(s.iptv.label||'provider')+' · '+s.iptv.live+' channels, '+s.iptv.vod+' movies, '+s.iptv.series+' series. Send new details to replace it.'):'No provider on the TV yet.';
      var p=$('#prof'), keep=p.value; p.innerHTML='';
      (s.profiles||[]).forEach(function(x){ var o=document.createElement('option'); o.value=x.id; o.textContent=x.name; p.appendChild(o); });
      p.value=keep&&(s.profiles||[]).some(function(x){return x.id===keep})?keep:(s.profile||'');
    }).catch(function(){ $('#dot').className='off'; }).then(function(){ pollT=setTimeout(poll,document.hidden?15000:3000); });
  }
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) poll(); });

  setKind('music');
  if(TOKEN){ $('#app').hidden=false; poll(); } else $('#pair').hidden=false;
})();
</script>
</body></html>
